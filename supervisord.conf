[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
user=root
 
[program:app]
command=/opt/conda/envs/docker_gpu_env/bin/python /app/workspace/main.py
directory=/app
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
autorestart=true
autostart=true
priority=10
redirect_stderr=true
 
[program:filebrowser]
command=/usr/local/bin/filebrowser
directory=/app
autorestart=true
autostart=true
priority=20
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0